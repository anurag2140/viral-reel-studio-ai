<!doctype html>
<html lang="hi">
<head>
<meta charset="utf-8">
<title>Outro F</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@700;800&family=Mukta:wght@500;600;700&display=block" rel="stylesheet">
<style>
  html, body { margin: 0; background: #111; overflow: hidden; }
  #stage { width: 1080px; height: 1920px; position: relative; overflow: hidden; transform-origin: 0 0; background: var(--paper); --cap-top: 268px; }
  #paper { position: absolute; inset: -200px 0; background-image: repeating-linear-gradient(#0000 0 94px, var(--rule) 94px 97px); }
  svg { position: absolute; left: 0; top: 0; overflow: visible; }
</style>
</head>
<body>
<div id="stage">
  <div id="paper"></div>
  <svg id="world" width="1080" height="1920"></svg>
  <div id="caps"></div>
</div>
<script type="module">
import { $, boot, box, bump, circ, clamp, createKit, ei, eio, eo, lerp, preview, prog, sp } from '/brand/kagaz.js';
import { build } from './timeline.js';

const stage = document.getElementById('stage');
const brand = await boot(stage);
const vo = await (await fetch('vo.json')).json();
const { dur, L, T, words } = build(vo);
const kit = createKit(brand);
const { stroke, pop, card, U, st, PAPER, CARD, INK, RED } = kit;
const HANDLE = '@vipulsingh_ai';
const text = (parent, x, y, str, a = {}) => {
  const e = $('text', { x, y, 'font-family': '"Baloo 2"', 'font-weight': 800, 'font-size': 80, fill: INK, 'text-anchor': 'middle', ...a }, parent);
  e.textContent = str;
  return e;
};
const world = document.getElementById('world');
const defs = $('defs', {}, world);
const root = $('g', {}, world);

// Sticker Pop backdrop: rays, stickers and (where there is room) the mascot
kit.sunburst(root, 540, 1000);
kit.sticker(root, 'circle', 1040, 1575, 110, kit.MINT);
kit.sticker(root, 'plus', 70, 1180, 30, kit.ORANGE);
{ const tilt = $('g', { transform: 'rotate(-14 1010 1040)' }, root); kit.mascot(tilt, 1010, 1040, 0.42, { t: T.logo, pose: (t) => ({ look: [540, 770], wave: 1, hop: 50 * Math.max(0, bump(t - T.press - 0.05)) }) }); }
// a rubber stamp: outline or filled, hits hard and settles
function stamp(parent, x, y, rot, str, t, o = {}) {
  const { filled = false, w = 330, out = null, size = 70 } = o;
  const g = $('g', {}, parent);
  $('rect', { x: -w / 2, y: -56, width: w, height: 112, rx: 12, fill: filled ? RED : CARD, stroke: RED, 'stroke-width': 10 }, g);
  text(g, 0, 28, str, { 'font-size': size, fill: filled ? PAPER : RED });
  U.push((time) => {
    const q = time - t;
    let k = q < 0 ? 0 : lerp(2.6, 1, eo(clamp(q / 0.12))) * (1 + 0.06 * bump(q - 0.12));
    if (out != null) k *= 1 - ei(prog(time, out, 0.15));
    g.style.display = k <= 0.002 ? 'none' : '';
    g.setAttribute('transform', `translate(${x} ${y}) rotate(${rot}) scale(${k})`);
  });
  return g;
}

// ---------- 1. every video: a stack of hard topics; the last one is wiped into plain language ----------
{
  const S = $('g', {}, root);
  U.push((t) => {
    const q = ei(prog(t, T.toCta, 0.3));
    S.style.display = q >= 1 ? 'none' : '';
    S.setAttribute('transform', `translate(0 ${-1750 * q}) rotate(${-8 * q} 540 960)`);
  });
  const W = 820;
  const H = 760;
  const CX = 540;
  const CY = 1000;
  card(S, CX - 16, CY + 6, W, H, -7);
  card(S, CX + 18, CY, W, H, 6);

  // what a hard page looks like: a big term and dense lines
  const hard = (g, title, size) => {
    text(g, 0, -90, title, { 'font-size': size });
    [10, 82, 154, 226].forEach((y, i) => {
      const pts = Array.from({ length: 9 }, (_, k) => [-330 + k * (i === 3 ? 52 : 82), y + (k % 2 ? -9 : 9)]);
      stroke(g, pts, { t: -1, w: 9, smooth: true, amp: 3, op: 0.55 });
    });
  };
  const label = (g, n) => text(g, -350, -292, `VIDEO #${n}`, { 'font-family': 'Mukta', 'font-weight': 700, 'font-size': 46, 'letter-spacing': '0.1em', 'text-anchor': 'start' });

  // the page that stays: Encryption
  const keep = $('g', { transform: `translate(${CX} ${CY}) rotate(-2)` }, S);
  card(keep, 0, 0, W, H, 0);
  label(keep, 9);
  const clipA = $('rect', { y: -400, height: 800 }, $('clipPath', { id: 'hardSide' }, defs));
  const clipB = $('rect', { x: -500, y: -400, height: 800 }, $('clipPath', { id: 'easySide' }, defs));
  const A = $('g', { 'clip-path': 'url(#hardSide)' }, keep);
  const Bg = $('g', { 'clip-path': 'url(#easySide)' }, keep);
  hard(A, 'Encryption', 132);
  text(Bg, -350, -196, 'Encryption  =', { 'font-family': 'Mukta', 'font-weight': 700, 'font-size': 58, 'text-anchor': 'start', opacity: 0.6 });
  text(Bg, 0, -62, 'ताला और चाबी', { 'font-size': 118 });
  const d0 = T.wipe.a + 0.08;
  stroke(Bg, box(-250, 110, 150, 130), { t: d0, d: 0.2, w: 13, amp: 2 });
  stroke(Bg, [[-222, 110], [-222, 58], [-175, 28], [-128, 58], [-128, 110]], { t: d0 + 0.08, d: 0.15, w: 13, smooth: true, amp: 2 });
  $('circle', { cx: -175, cy: 172, r: 15, fill: INK }, Bg);
  stroke(Bg, circ(90, 172, 48, 14), { t: d0 + 0.12, d: 0.15, w: 14, color: RED, smooth: true, amp: 2 });
  stroke(Bg, [[138, 172], [300, 172]], { t: d0 + 0.2, d: 0.1, w: 14, color: RED, amp: 1 });
  stroke(Bg, [[250, 172], [250, 214]], { t: d0 + 0.26, d: 0.06, w: 14, color: RED, amp: 1 });
  stroke(Bg, [[296, 172], [296, 206]], { t: d0 + 0.28, d: 0.06, w: 14, color: RED, amp: 1 });
  // the marker that does the wipe
  const band = $('rect', { x: -22, y: -400, width: 44, height: 800, rx: 20, fill: RED }, keep);
  U.push((t) => {
    const p = prog(t, T.wipe.a, T.wipe.d);
    const wx = lerp(-440, 440, eio(p));
    clipA.setAttribute('x', wx);
    clipA.setAttribute('width', 1000);
    clipB.setAttribute('width', wx + 500);
    band.style.display = p > 0 && p < 1 ? '' : 'none';
    band.setAttribute('transform', `translate(${wx} 0) rotate(5)`);
  });
  stamp(keep, 246, -330, 8, 'मुश्किल', T.hard, { out: T.wipe.a + 0.2 });
  stamp(keep, 246, -330, -6, 'आसान', T.easy, { filled: true, w: 290 });

  // the pages before it get thrown away, one per beat of the sentence
  [['Kubernetes', 122, 8, 1, 3], ['LLM', 190, 7, 0, -3]].forEach(([title, size, n, k, tilt]) => {
    const g = $('g', {}, S);
    const c = card(g, 0, 0, W, H, 0);
    label(c, n);
    hard(c, title, size);
    U.push((t) => {
      const q = ei(prog(t, T.throw[k], 0.32));
      g.style.display = q >= 1 ? 'none' : '';
      const e = k === 0 ? eo(clamp((t + 0.12) / 0.2)) : 1;
      g.setAttribute('transform', `translate(${CX + 1000 * q} ${CY - 1300 * q}) rotate(${tilt + 45 * q + (1 - e) * -10}) scale(${lerp(1.3, 1, e)})`);
    });
  });
}

// ---------- 2. follow first, then comment ----------
{
  const LY = 770;
  stroke(root, circ(540, LY, 216, 36, -1.6), { t: T.logo + 0.14, d: 0.3, color: RED, w: 22, smooth: true, amp: 6 });
  for (let i = 0; i < 16; i++) {
    const a = (i / 16) * Math.PI * 2 + 0.2;
    if (Math.sin(a) > 0.6) continue; // the handle card sits below
    const len = i % 2 ? 30 : 48;
    stroke(root, [[540 + Math.cos(a) * 246, LY + Math.sin(a) * 246], [540 + Math.cos(a) * (246 + len), LY + Math.sin(a) * (246 + len)]], { t: T.logo + 0.2 + i * 0.015, d: 0.1, w: 12, amp: 2 });
  }
  const logo = $('g', {}, root);
  $('image', { href: '/logo.png', x: -200, y: -200, width: 400, height: 400 }, logo);
  U.push((t) => {
    const x = t - T.logo;
    logo.style.display = x < 0 ? 'none' : '';
    const e = eo(clamp(x / 0.14));
    const k = lerp(2.6, 1, e) * (1 + 0.05 * bump(x - 0.14));
    logo.setAttribute('transform', `translate(540 ${LY - 18 * Math.max(0, bump(t - T.press - 0.05))}) rotate(${lerp(-18, -4, e) + Math.sin(t * 1.8) * 1.3}) scale(${k})`);
  });
  const h = card(root, 540, 1082, 760, 190, 2, T.user);
  text(h, 0, -4, HANDLE, { 'font-size': 84 });
  text(h, 0, 58, 'Instagram  ·  YouTube', { 'font-family': 'Mukta', 'font-weight': 700, 'font-size': 46, opacity: 0.75 });

  const BY = 1262;
  const btn = $('g', {}, root);
  $('rect', { x: -268, y: -48, width: 560, height: 124, rx: 62, fill: INK }, btn);
  const face = $('g', {}, btn);
  const body = $('rect', { x: -280, y: -62, width: 560, height: 124, rx: 62, stroke: INK, 'stroke-width': 8 }, face);
  const lab = text(face, 0, 26, '', { 'font-size': 76 });
  stroke(face, [[150, 0], [176, 28], [226, -34]], { t: T.press + 0.1, d: 0.16, w: 18, color: RED, amp: 2 });
  U.push((t) => {
    const x = t - T.btn;
    btn.style.display = x < 0 ? 'none' : '';
    const e = eo(clamp(x / 0.3));
    const down = Math.exp(-(((t - T.press - 0.05) / 0.07) ** 2));
    const done = t >= T.press + 0.06;
    body.setAttribute('fill', done ? kit.MINT : kit.PINK);
    lab.setAttribute('fill', done ? INK : PAPER);
    lab.setAttribute('x', done ? -40 : 0);
    lab.textContent = done ? 'Following' : 'Follow करो';
    face.setAttribute('transform', `translate(${12 * down} ${14 * down})`);
    btn.setAttribute('transform', `translate(540 ${BY + (1 - e) * 500}) rotate(${-2 + (1 - e) * 10}) scale(${1 + 0.06 * bump(x - 0.3) + 0.07 * bump(t - T.press - 0.1) + 0.03 * bump(t - T.recap)})`);
  });
  for (let i = 0; i < 12; i++) {
    const a = (i / 12) * Math.PI * 2 + 0.26;
    if (Math.abs(Math.sin(a)) > 0.5) continue; // only to the sides
    stroke(root, [[540 + Math.cos(a) * 330, BY + Math.sin(a) * 112], [540 + Math.cos(a) * 382, BY + Math.sin(a) * 140]], { t: T.press + 0.05, d: 0.14, w: 14, color: kit.ORANGE, amp: 2, out: T.press + 0.5 });
  }

  const c = card(root, 540, 1434, 900, 158, -2, T.box);
  $('image', { href: '/logo.png', x: -430, y: -62, width: 124, height: 124 }, c);
  const typed = text(c, -280, 26, '', { 'font-size': 76, 'text-anchor': 'start' });
  const caret = $('rect', { y: -42, width: 9, height: 82, rx: 4, fill: RED }, c);
  const str = 'Blockchain?';
  U.push((t) => {
    const n = Math.round(prog(t, T.type.a, T.type.b - T.type.a) * str.length);
    typed.textContent = str.slice(0, n);
    caret.setAttribute('x', -280 + (n ? typed.getComputedTextLength() : 0) + 10);
    caret.style.display = t < T.type.b || Math.sin(t * 22) > 0 ? '' : 'none';
  });
  const send = $('g', {}, pop(c, 382, 0, { t: T.box + 0.22 }));
  $('circle', { r: 50, fill: RED, stroke: INK, 'stroke-width': 8 }, send);
  $('path', { d: 'M-20 0 H20 M4 -18 L22 0 L4 18', fill: 'none', stroke: PAPER, 'stroke-width': 11, 'stroke-linecap': 'round', 'stroke-linejoin': 'round' }, send);
  U.push((t) => send.setAttribute('transform', `scale(${1 + 0.3 * bump(t - T.send)})`));
}

// ---------- captions ----------
kit.captions(document.getElementById('caps'), [
  { a: L.promise.s[0].a, text: L.promise.s[0].text, hl: 'अपनी भाषा', words: words.P },
  { a: L.cta.s[0].a, text: L.cta.s[0].text, hl: 'Follow करो', words: words.C },
], dur);

// ---------- seek ----------
const paperEl = document.getElementById('paper');
window.DUR = dur;
window.seek = (t) => {
  const b = prog(t, T.toCta, 0.42);
  const rot = 3 * Math.sin(Math.PI * b);
  root.setAttribute('transform', `rotate(${rot} 540 960)`);
  paperEl.style.transform = `translateY(${-(eio(b) * 62) % 97}px) rotate(${rot * 0.3}deg)`;
  kit.frame(t);
};
window.seek(0);
window.ready = true;
if (!new URLSearchParams(location.search).has('render')) preview(stage, window.seek);
</script>
</body>
</html>
