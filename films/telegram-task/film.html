<script type="module">
// A comedy skit about the Telegram task scam (E2, second try). Places: my hostel room by day
// (the hook: an empty wallet; the ending: the same message, blocked; the link line), a big drawn
// phone (the job message, Chintu's rubber arm liking videos, the VIP group where every happy
// member is Mitthu, the task, PAY, removed), my desk at night (the ₹150 was the cheese in a
// mousetrap; the rule with a SCAM stamp), and the cybercrime portal for 1930 and the complaint.
// The chats are drawn and generic ("Job Agent", "VIP Earning Group"), not a real product's screen.
import { S, backOut, bump, camera, captionsCompact, cubicOut, eio, expoOut, key, lerp, person, pointer, prog, pulse, setup, start, webpage } from '/brand/story.js';
import { CORAL, INK, NAVY, BLUE, dayWall, desk, followCard, lights, linkLine, paperPlane, show, star, whip, whipIn, whipOut } from '/brand/scenes.js';
import { monkey, macaw } from '/brand/cast.js';
import { build } from './timeline.js';

const stage = document.getElementById('stage');
const svg = document.getElementById('scene');
const vo = await (await fetch('vo.json')).json();
const { dur, Q, T } = build(vo);
const PORTAL = 'shots/portal4x.jpg'; // cybercrime.gov.in: header 34 to 100 css px, then 204 to 660 (the banner left out), at 4x
const FACE = { dir: '/brand/face/', meta: await (await fetch('/brand/face/face.json')).json() };
const ME = { face: FACE, skin: FACE.meta.cheek, shade: '#D98A52', outfit: 'hoodie' };
await setup(['800 100px "Anek Devanagari"', '700 40px "Anek Devanagari"', '600 33px "Anek Devanagari"'], [PORTAL, '/logo.png', ...FACE.meta.names.map((n) => `${FACE.dir}${n}.png`)]);
const pop = (t, at) => 1 - 0.07 * at.reduce((v, a) => v + Math.max(0, bump(t - a)), 0);
const place = (g, x, y, s = 1, r = 0) => g.setAttribute('transform', `translate(${x} ${y}) rotate(${r}) scale(${s})`);
const U = [];
const L = lights(svg);
const defs = L.defs;
const YEL = '#FFD23F';
const GREEN = '#19C37D';
const FUR = '#8A5A35';
const line = { stroke: INK, 'stroke-width': 6, 'stroke-linejoin': 'round', 'stroke-linecap': 'round' };
const chip = (parent, text, w, size, fill = YEL, ink = NAVY) => {
  const g = S('g', {}, parent);
  S('rect', { x: -w / 2, y: -size * 0.75, width: w, height: size * 1.5, rx: size * 0.36, fill, ...line }, g);
  S('text', { y: size * 0.36, 'text-anchor': 'middle', 'font-size': size, fill: ink }, g, text);
  return g;
};
const tickPath = (parent, x, y, r, stroke = '#fff') => S('path', { d: `M${x - r},${y} L${x - r * 0.3},${y + r * 0.7} L${x + r},${y - r * 0.7}`, fill: 'none', stroke, 'stroke-width': r * 0.45, 'stroke-linecap': 'round', 'stroke-linejoin': 'round' }, parent);
const crossPath = (parent, x, y, r, stroke = CORAL) => S('path', { d: `M${x - r},${y - r} L${x + r},${y + r} M${x + r},${y - r} L${x - r},${y + r}`, stroke, 'stroke-width': r * 0.42, 'stroke-linecap': 'round' }, parent);
const HEART = 'M0,16 C-30,-6 -22,-30 0,-14 C22,-30 30,-6 0,16 Z';
function bubble(parent, lines, w, size, fill = '#fff', ink = NAVY) {
  const g = S('g', {}, parent);
  const h = lines.length * size * 1.25 + size * 0.9;
  S('path', { d: `M${-w / 2 + 30},${-h / 2} L${w / 2 - 30},${-h / 2} Q${w / 2},${-h / 2} ${w / 2},${-h / 2 + 30} L${w / 2},${h / 2 - 30} Q${w / 2},${h / 2} ${w / 2 - 30},${h / 2} L${-w / 2 + 80},${h / 2} L${-w / 2 + 50},${h / 2 + 40} L${-w / 2 + 54},${h / 2} L${-w / 2 + 30},${h / 2} Q${-w / 2},${h / 2} ${-w / 2},${h / 2 - 30} L${-w / 2},${-h / 2 + 30} Q${-w / 2},${-h / 2} ${-w / 2 + 30},${-h / 2} Z`, fill, ...line }, g);
  lines.forEach((s, i) => S('text', { y: -h / 2 + size * 1.05 + i * size * 1.25 + size * 0.15, 'text-anchor': 'middle', 'font-size': size, fill: ink }, g, s));
  return g;
}
// a phone in the hand, with a screen that can change
function handPhone(parent) {
  const g = S('g', {}, parent);
  S('rect', { x: -62, y: -110, width: 124, height: 220, rx: 22, fill: NAVY, ...line }, g);
  const red = S('g', {}, g);
  S('rect', { x: -50, y: -94, width: 100, height: 188, rx: 12, fill: '#FFE2E7' }, red);
  S('circle', { cy: -10, r: 30, fill: CORAL }, red);
  crossPath(red, 0, -10, 14, '#fff');
  S('rect', { x: -34, y: 40, width: 68, height: 10, rx: 5, fill: CORAL, opacity: 0.6 }, red);
  const blue = S('g', {}, g);
  S('rect', { x: -50, y: -94, width: 100, height: 188, rx: 12, fill: '#BFD0FF' }, blue);
  S('rect', { x: -38, y: -70, width: 76, height: 30, rx: 12, fill: '#fff' }, blue);
  S('rect', { x: -38, y: -28, width: 60, height: 30, rx: 12, fill: '#fff' }, blue);
  const btn = S('g', { transform: 'translate(0 56)' }, blue);
  S('rect', { x: -40, y: -20, width: 80, height: 40, rx: 14, fill: CORAL }, btn);
  return { g, red, blue, btn };
}
// a small Mitthu for the group's avatars: every member is the same parrot
function parrotFace(parent) {
  const g = S('g', {}, parent);
  S('circle', { r: 34, fill: '#E2342C', ...line, 'stroke-width': 4 }, g);
  S('path', { d: 'M-4,-14 C14,-20 26,-6 24,12 C14,20 0,16 -6,6 Z', fill: '#F8F3EA' }, g);
  S('circle', { cx: 8, cy: -4, r: 5, fill: '#1A1014' }, g);
  S('path', { d: 'M18,-12 C38,-16 44,10 32,24 C30,10 24,4 16,4 Z', fill: '#EFE8DA', stroke: INK, 'stroke-width': 3 }, g);
  return g;
}
// a rubber arm: Chintu reaches from his shoulder to a point, however far
function rubberArm(parent) {
  const outl = S('path', { fill: 'none', stroke: INK, 'stroke-width': 38, 'stroke-linecap': 'round' }, parent);
  const fur = S('path', { fill: 'none', stroke: FUR, 'stroke-width': 28, 'stroke-linecap': 'round' }, parent);
  const hand = S('circle', { r: 24, fill: '#F2CFA3', stroke: INK, 'stroke-width': 4 }, parent);
  return (on, a, b, wob = 0) => {
    [outl, fur, hand].forEach((e) => show(e, on));
    if (!on) return;
    const mx = (a[0] + b[0]) / 2 + 60 + wob;
    const my = (a[1] + b[1]) / 2 + 40;
    const d = `M${a[0]},${a[1]} Q${mx},${my} ${b[0]},${b[1]}`;
    outl.setAttribute('d', d); fur.setAttribute('d', d);
    hand.setAttribute('cx', b[0]); hand.setAttribute('cy', b[1]);
  };
}

// ================= my hostel room by day =================
const C = { s: S('g', {}, svg) };
C.w = S('g', {}, C.s);
C.cam = camera(C.w);
C.blur = L.blurOf('mbHostel');
const wallTick = dayWall(C.w);
// a poster and a shelf
const poster = S('g', { transform: 'translate(250 520) rotate(-4)' }, C.w);
S('rect', { x: -110, y: -140, width: 220, height: 280, rx: 8, fill: '#BFE3FF', ...line }, poster);
S('circle', { cx: 0, cy: -30, r: 56, fill: YEL, ...line, 'stroke-width': 4 }, poster);
S('rect', { x: -70, y: 60, width: 140, height: 18, rx: 9, fill: NAVY }, poster);
S('rect', { x: -50, y: 92, width: 100, height: 12, rx: 6, fill: '#7B8BB8' }, poster);
S('rect', { x: -700, y: 1500, width: 2480, height: 1200, fill: '#E2C9A0' }, C.w);
S('rect', { x: -700, y: 1500, width: 2480, height: 16, fill: '#CFAF7E' }, C.w);
// the bed on the right
S('rect', { x: 600, y: 1340, width: 760, height: 170, rx: 20, fill: '#8C5A2E', ...line }, C.w);
S('rect', { x: 610, y: 1260, width: 740, height: 110, rx: 30, fill: '#fff', ...line }, C.w);
S('path', { d: 'M700,1290 L1350,1280 L1350,1380 L680,1380 Z', fill: '#7B9CFF', ...line }, C.w);
for (let k = 0; k < 4; k++) S('path', { d: `M${760 + k * 140},1300 l40,60`, stroke: '#5C7DE0', 'stroke-width': 10, 'stroke-linecap': 'round' }, C.w);
const chintuC = monkey(C.w);
const meC = person(C.w, ME);
const cFront = S('g', {}, C.w);
const myPhone = handPhone(cFront);
// Chintu's empty wallet and the moth that flies out of it
const wallet = S('g', {}, cFront);
S('rect', { x: -80, y: -50, width: 160, height: 100, rx: 18, fill: '#7A4A2A', ...line }, wallet);
S('rect', { x: -66, y: -36, width: 132, height: 72, rx: 12, fill: 'none', stroke: '#C99257', 'stroke-width': 4, 'stroke-dasharray': '10 8' }, wallet);
S('path', { d: 'M-80,-4 L80,-4', stroke: '#3D2412', 'stroke-width': 6 }, wallet);
S('circle', { cx: 50, cy: -4, r: 11, fill: YEL, stroke: INK, 'stroke-width': 3 }, wallet);
const moth = S('g', {}, cFront);
const wings = [-1, 1].map((m) => S('ellipse', { cx: m * 20, cy: 0, rx: 22, ry: 14, fill: '#C9C2B6', stroke: INK, 'stroke-width': 3 }, moth));
S('ellipse', { rx: 7, ry: 16, fill: '#8F877A', stroke: INK, 'stroke-width': 3 }, moth);
const tears = [0, 1].map(() => S('path', { d: 'M0,-14 Q10,2 0,10 Q-10,2 0,-14 Z', fill: '#6FC3FF', stroke: '#2F8AD8', 'stroke-width': 2 }, cFront));
const zero = chip(cFront, '₹0', 200, 76, '#fff', CORAL);
const rewind = S('g', {}, cFront);
S('rect', { x: -240, y: -52, width: 480, height: 104, rx: 34, fill: NAVY, ...line }, rewind);
for (const dx of [-170, -126]) S('path', { d: `M${dx + 40},-24 L${dx},0 L${dx + 40},24 Z`, fill: YEL }, rewind);
S('text', { x: 40, y: 22, 'text-anchor': 'middle', 'font-size': 60, fill: '#fff' }, rewind, '3 दिन पहले');
// the ending: the same message again, then BLOCKED
const again = bubble(cFront, ['Part-time job!', 'हर like = ₹50'], 420, 46, '#fff');
const blocked = S('g', {}, cFront);
S('rect', { x: -220, y: -64, width: 440, height: 128, rx: 26, fill: '#fff', stroke: CORAL, 'stroke-width': 14 }, blocked);
S('text', { y: 30, 'text-anchor': 'middle', 'font-size': 84, fill: CORAL }, blocked, 'BLOCKED');
const sparksC = [[-200, -110, 30], [210, -120, 24], [230, 90, 22], [-220, 90, 26]].map(([x, y, r]) => ({ e: star(cFront, 0, 0, r, YEL), x, y }));
const plane = paperPlane(cFront, [330, 1150], [700, 760], [1300, 520]);

U.push((t) => {
  const A = t < T.trouble - 0.2;   // the hook
  const E = t >= T.end - 0.2;      // the same message, blocked; the link line; the ask
  if (!show(C.s, A || E)) return;
  wallTick(t);
  const link = t >= T.link - 0.2;
  show(wallet, A); show(moth, A); tears.forEach((e) => show(e, A)); show(zero, A); show(rewind, A && t > T.sach - 0.05);
  show(again, E && !link && t > T.wahi - 0.1 && t < T.block);
  show(blocked, E && !link && t >= T.block);
  sparksC.forEach((s) => show(s.e, E && !link && t > T.block));
  show(myPhone.red, A); show(myPhone.blue, E);
  plane(t, link ? T.send + 0.2 : 1e9, T.sendWord + 0.3);
  if (A) {
    whip(C.s, C.blur, 0, 0);
    whipOut(C.s, C.blur, t, T.trouble - 0.2, -1);
    C.cam(...key(t, [[0, [600, 1010, 1.12]], [T.sach, [600, 1000, 1.2], (p) => p], [T.trouble, [600, 990, 1.26]]]));
    const hand = [170, -390 + 6 * Math.sin(t * 3)];
    meC.pose({ x: 300, y: 1640, s: 1.5, tilt: 4 + 2 * Math.sin(t * 2.4), face: t < T.sach ? 'worried' : 'thinking', pop: pop(t, [T.dube, T.sach]), handL: [-150, -62], handR: hand });
    place(myPhone.g, 300 + hand[0] * 1.5 + 10, 1640 + hand[1] * 1.5 - 70, 1, 8);
    // Chintu sobs on the bed with the empty wallet
    const sob = 6 * Math.sin(t * 14);
    // he holds the wallet up, upside down, and shakes it: only a moth comes out
    chintuC.pose({ x: 820, y: 1340 + Math.abs(sob), s: 1.1, face: 'worried', tilt: -6 + sob * 0.5, handL: [-50, -250], handR: [110, -320], tail: t * 2 });
    place(wallet, 820 + 110 * 1.1 + 10, 1340 - 320 * 1.1 - 40 + Math.abs(sob), 1.1, 160 + 10 * Math.sin(t * 12));
    const mp = (t * 0.45) % 1;
    place(moth, 900 + 70 * Math.sin(t * 2.6) - 120 * mp, 900 - 260 * mp, 1.8, 10 * Math.sin(t * 5));
    wings.forEach((w, i) => w.setAttribute('ry', 14 * Math.abs(Math.sin(t * 22 + i))));
    tears.forEach((e, i) => { const k = (t * 1.6 + i * 0.5) % 1; e.setAttribute('transform', `translate(${820 + (i ? 38 : -38) * 1.1} ${1340 - 320 * 1.1 + 150 * k}) scale(${1.4 - 0.4 * k})`); });
    place(zero, 820, 800 + 6 * Math.sin(t * 2.5), backOut(prog(t, 0.2, 0.35)) * (1 + 0.06 * Math.max(0, bump(t - T.dube))), -6);
    place(rewind, 560, 520, backOut(prog(t, T.sach - 0.05, 0.35)), -3);
    return;
  }
  // the next day: the message again; Chintu reaches for it; I block it
  if (t < T.end + 0.25) whipIn(C.s, C.blur, t, T.end - 0.2, 1);
  else whip(C.s, C.blur, 0, 0);
  C.cam(...key(t, [[T.end - 0.2, [600, 1000, 1.04]], [T.block, [600, 990, 1.14], (p) => p], [T.link - 0.2, [580, 980, 1.12], (p) => p], [T.link + 0.2, [70, 1020, 1.3]], [dur, [70, 1010, 1.34], (p) => p]]));
  const blk = t >= T.block;
  const reach = !link && t > T.wahi && !blk ? eio(prog(t, T.wahi, 0.4)) : 0;
  const clap = blk && !link ? Math.abs(Math.sin(t * 9)) : 0;
  chintuC.pose({
    x: 760, y: 1340 - 20 * Math.max(0, bump(t - T.block - 0.1)), s: 1.1, tilt: -4 + 3 * Math.sin(t * 2.5),
    face: blk ? (t < T.block + 0.4 ? 'amazed' : 'grin') : t > T.wahi ? 'grin' : 'neutral', tail: t * 3,
    handL: blk ? [-20 - 30 * clap, -230] : [lerp(-90, -150, reach), lerp(-110, -260, reach)], handR: blk ? [20 + 30 * clap, -230] : [90, -110],
  });
  const offer = link ? eio(prog(t, T.link, 0.3)) * (1 - prog(t, T.send - 0.1, 0.2)) : 0;
  const hold = link ? [lerp(-70, -215, offer), lerp(-200, -360, offer) - 8 * offer * Math.sin(t * 6)] : [170 - 40 * Math.max(0, bump(t - T.block)), -390 + 6 * Math.sin(t * 3)];
  meC.pose({
    x: 300, y: 1640 - 24 * Math.max(0, bump(t - T.sendWord)), s: 1.5, tilt: 4 + 2 * Math.sin(t * 2.3),
    face: !link ? (t < T.wahi ? 'neutral' : t < T.block ? 'look-right' : 'wink') : t < T.comment - 0.1 ? 'talk' : t < T.send ? 'grin' : 'wink',
    pop: pop(t, [T.wahi, T.block, T.link, T.send]),
    handL: link ? hold : blk ? [-170, -440] : [-150, -62], gripL: !link && blk ? 'thumb' : 'open',
    handR: link ? (t > T.send ? [160, -470] : [150, -62]) : hold, gripR: link && t > T.send ? 'thumb' : 'open',
  });
  const hx = link ? hold[0] : hold[0];
  place(myPhone.g, 300 + hx * 1.5 + (link ? -4 : 10), 1640 + hold[1] * 1.5 - 70, 1, link ? -8 : 8);
  myPhone.btn.setAttribute('transform', `translate(0 56) scale(${1 - 0.2 * pulse(t, T.block, 0.07)})`);
  place(again.g ?? again, 640, 640 + 6 * Math.sin(t * 2.5), backOut(prog(t, T.wahi - 0.1, 0.3)), 3);
  place(blocked, 620, 660, lerp(1.8, 1, Math.min(1, prog(t, T.block, 0.15))) * (1 + 0.04 * Math.max(0, bump(t - T.block - 0.15))), -8);
  sparksC.forEach((s, i) => place(s.e, 620 + s.x, 660 + s.y, 0.7 + 0.3 * Math.sin(t * 5 + i * 2), t * 30));
});

// ================= the big phone: the job, the likes, the VIP group, PAY, removed =================
const P = { s: S('g', {}, svg) };
P.w = S('g', {}, P.s);
P.cam = camera(P.w);
P.blur = L.blurOf('mbPhone');
S('rect', { x: -700, y: -700, width: 2480, height: 3320, fill: '#DCE6FF' }, P.w);
for (const [x, y, r, f] of [[110, 320, 170, '#CBD8FF'], [990, 1460, 230, '#CBD8FF'], [960, 300, 90, '#FFE3BF']]) S('circle', { cx: x, cy: y, r, fill: f }, P.w);
S('rect', { x: 190, y: 200, width: 700, height: 1200, rx: 84, fill: NAVY, ...line }, P.w);
S('rect', { x: 222, y: 240, width: 636, height: 1120, rx: 60, fill: '#F3F5FA' }, P.w);
S('rect', { x: 222, y: 240, width: 636, height: 1120, rx: 60 }, S('clipPath', { id: 'phScr' }, defs));
const pscr = S('g', { 'clip-path': 'url(#phScr)' }, P.w);
// chat 1: the job agent and three videos
const chat1 = S('g', {}, pscr);
S('rect', { x: 222, y: 240, width: 636, height: 1120, fill: '#EEF3FA' }, chat1);
S('rect', { x: 222, y: 240, width: 636, height: 130, fill: '#fff' }, chat1);
S('circle', { cx: 300, cy: 305, r: 38, fill: NAVY, ...line, 'stroke-width': 4 }, chat1);
S('text', { x: 300, y: 318, 'text-anchor': 'middle', 'font-size': 34, fill: '#fff' }, chat1, 'J');
S('text', { x: 360, y: 300, 'font-size': 40, fill: NAVY }, chat1, 'Job Agent');
S('text', { x: 360, y: 342, 'font-size': 26, fill: GREEN }, chat1, 'online');
const offerB = S('g', {}, chat1);
S('rect', { x: 250, y: 395, width: 520, height: 180, rx: 28, fill: '#fff', ...line, 'stroke-width': 4 }, offerB);
S('text', { x: 280, y: 450, 'font-size': 38, fill: NAVY }, offerB, 'Part-time job!');
S('text', { x: 280, y: 500, 'font-size': 36, fill: NAVY }, offerB, 'बस video like करो');
S('text', { x: 280, y: 550, 'font-size': 36, fill: GREEN }, offerB, 'हर like = ₹50');
const CARD_Y = [610, 820, 1030];
const THUMB = ['#FF6B4A', '#7B4DFF', '#2FB5FF'];
const vids = CARD_Y.map((y, i) => {
  const g = S('g', {}, chat1);
  S('rect', { x: 250, y, width: 580, height: 180, rx: 24, fill: '#fff', ...line, 'stroke-width': 4 }, g);
  S('rect', { x: 268, y: y + 18, width: 230, height: 144, rx: 14, fill: THUMB[i] }, g);
  S('path', { d: `M${362},${y + 60} L${410},${y + 90} L${362},${y + 120} Z`, fill: '#fff' }, g);
  S('rect', { x: 518, y: y + 40, width: 120, height: 16, rx: 8, fill: '#C9CEDA' }, g);
  S('rect', { x: 518, y: y + 72, width: 90, height: 14, rx: 7, fill: '#C9CEDA' }, g);
  const btn = S('g', {}, g);
  const ring = S('circle', { r: 46, fill: '#fff', stroke: '#C9CEDA', 'stroke-width': 6 }, btn);
  const heart = S('path', { d: HEART, fill: 'none', stroke: CORAL, 'stroke-width': 6, transform: 'scale(1.3)' }, btn);
  const plus = S('text', { 'text-anchor': 'middle', 'font-size': 42, fill: GREEN }, g, '+₹50');
  return { g, btn, ring, heart, plus, y, at: [712, y + 110] };
});
const notif = S('g', {}, pscr);
S('rect', { x: 240, y: -50, width: 600, height: 100, rx: 30, fill: GREEN, ...line, 'stroke-width': 4 }, notif);
S('circle', { cx: 300, cy: 0, r: 30, fill: '#fff' }, notif);
tickPath(notif, 300, 0, 16, GREEN);
S('text', { x: 350, y: 16, 'font-size': 44, fill: '#fff' }, notif, '₹150 credited');
// chat 2: the VIP group; every member is Mitthu
const chat2 = S('g', {}, pscr);
S('rect', { x: 222, y: 240, width: 636, height: 1120, fill: '#EEF3FA' }, chat2);
const msgs = S('g', {}, chat2);
const MEMBERS = [['Rahul', 'मुझे ₹1300 मिल गए!', '#2F5BFF'], ['Neha', 'Thank you sir!', '#E8578A'], ['Amit', 'मुझे भी मिल गए!', GREEN], ['Pooja', 'Best group!', '#7B4DFF']];
const rows = MEMBERS.map(([who, txt, col], i) => {
  const g = S('g', {}, msgs);
  parrotFace(g);
  const w = 60 + txt.length * 21;
  S('rect', { x: 46, y: -44, width: w, height: 94, rx: 26, fill: '#fff', ...line, 'stroke-width': 4 }, g);
  S('text', { x: 70, y: -12, 'font-size': 24, fill: col }, g, who);
  S('text', { x: 70, y: 30, 'font-size': 34, fill: NAVY }, g, txt);
  return g;
});
const task = S('g', {}, msgs);
S('rect', { x: 250, y: 950, width: 580, height: 310, rx: 28, fill: '#FFF4CC', ...line, 'stroke-width': 5 }, task);

U.push((t) => {

});
