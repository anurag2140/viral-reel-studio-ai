<!doctype html>
<html lang="hi">
<head>
<meta charset="utf-8">
<title>TEMPLATE: short loop</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Anek+Devanagari:wdth,wght@75..125,400..800&display=block" rel="stylesheet">
<style>
  html, body { margin: 0; background: #000; overflow: hidden; }
  #stage { width: 1080px; height: 1920px; position: relative; overflow: hidden; transform-origin: 0 0; background: #FFE3BF; font-family: "Anek Devanagari"; }
  #scene { position: absolute; left: 0; top: 0; }
  #scene text { font-family: "Anek Devanagari"; font-weight: 800; }
</style>
</head>
<body>
<div id="stage"><svg id="scene" viewBox="0 0 1080 1920" width="1080" height="1920"></svg></div>
<script type="module">
// TEMPLATE, the short loop (experiment E3): one trick in under 15 seconds that plays as a loop.
// Shot A: my desk by day, the result held up (frame 0, and again at the very end in exactly the
// same state, so the loop has no seam). Shot B: the tool. Here it is a drawn PLACEHOLDER phone;
// in a reel the real page fills the frame instead (webpage() and capture-strip, as in #11).
// Shot C: the desk again, for the tool-link line.
// To make a reel: copy this folder, write script.json, replace the card and shot B, keep
// u(t) (the loop clock) and the rule that the last shot ends in the frame-0 state.
import { S, backOut, bump, camera, captionsCompact, cubicOut, eio, expoOut, key, lerp, pointer, prog, pulse, setup, start } from '/brand/story.js';
import { INK, NAVY, desk, lights, linkLine, show, star, whip, whipIn } from '/brand/scenes.js';
import { build } from './timeline.js';

const stage = document.getElementById('stage');
const svg = document.getElementById('scene');
const vo = await (await fetch('vo.json')).json();
const { dur, Q, T } = build(vo);
const FACE = { dir: '/brand/face/', meta: await (await fetch('/brand/face/face.json')).json() };
const ME = { face: FACE, skin: FACE.meta.cheek, outfit: 'hoodie' };
await setup(['800 100px "Anek Devanagari"', '700 40px "Anek Devanagari"'], ['/logo.png', ...FACE.meta.names.map((n) => `${FACE.dir}${n}.png`)]);
const pop = (t, at) => 1 - 0.07 * at.reduce((v, a) => v + Math.max(0, bump(t - a)), 0);
const place = (g, x, y, s = 1, r = 0) => g.setAttribute('transform', `translate(${x} ${y}) rotate(${r}) scale(${s})`);
const U = [];
const L = lights(svg);
const YEL = '#FFD23F';
const GREEN = '#19C37D';
const BLUE = '#2F5BFF';
const line = { stroke: INK, 'stroke-width': 6, 'stroke-linejoin': 'round', 'stroke-linecap': 'round' };

// The loop clock: in the last shot it counts up to 0 at the very end, so the last frame
// leads straight into frame 0. Shot A uses u(t) for everything it moves.
const A2 = T.back - 0.25;
const u = (t) => (t >= A2 ? t - dur : t);

// ================= shots A and C: my desk by day =================
const D = desk(svg, L, ME, { day: true });
// the result (PLACEHOLDER): clean typed notes with a green tick
const card = S('g', {}, D.props);
S('rect', { x: -170, y: -220, width: 340, height: 440, rx: 24, fill: '#fff', ...line }, card);
S('rect', { x: -130, y: -170, width: 200, height: 26, rx: 13, fill: BLUE }, card);
[250, 210, 240, 170, 230, 190].forEach((w, k) => S('rect', { x: -130, y: -110 + k * 46, width: w, height: 16, rx: 8, fill: NAVY, opacity: 0.8 }, card));
const tick = S('g', {}, card);
S('circle', { r: 50, fill: GREEN, ...line }, tick);
S('path', { d: 'M-22,2 L-6,18 L24,-16', fill: 'none', stroke: '#fff', 'stroke-width': 12, 'stroke-linecap': 'round', 'stroke-linejoin': 'round' }, tick);
const sparks = [[-200, -250, 34], [210, -140, 26], [-190, 200, 22]].map(([x, y, r]) => ({ g: star(D.props, 0, 0, r, YEL), x, y }));

U.push((t) => {
  const inA = t < T.how - 0.25 || t >= A2;
  const inC = t >= T.link - 0.25 && t < A2;
  show(D.s, inA || inC);
  if (!inA && !inC) return;
  D.tick(t);
  whip(D.s, D.blur, 0, 0);
  if (inA) {
    const v = u(t);
    if (t >= A2) whipIn(D.s, D.blur, t, A2, -1);
    D.cam(...key(v, [[-1, [540, 960, 1.34]], [0, [540, 1000, 1.22]], [T.how, [540, 1010, 1.3], (p) => p]]));
    const hand = [147, -493 + 8 * Math.sin(v * 3)];
    const yes = v > T.clean;
    D.kid.pose({
      x: 540, y: 1640 - 24 * Math.max(0, bump(v - T.clean)), s: 1.5, tilt: -3 + 2 * Math.sin(v * 2.2),
      face: yes ? 'grin' : 'talk', pop: pop(v, [T.clean]),
      handL: yes ? [-170, -330] : [-120, -260], gripL: yes ? 'thumb' : 'open', handR: hand,
    });
    show(card, true);
    place(card, 540 + hand[0] * 1.5 + 40, 1640 + hand[1] * 1.5 - 160, 0.7 * (1 + 0.06 * Math.max(0, bump(v - T.clean))), 6 + 2 * Math.sin(v * 2));
    place(tick, 130, -200, 1 + 0.35 * Math.max(0, bump(v - T.clean)));
    sparks.forEach((s, i) => {
      const p = backOut(prog(v, T.clean + i * 0.08, 0.3));
      show(s.g, p > 0);
      place(s.g, 540 + hand[0] * 1.5 + 40 + s.x * 0.7, 1640 + hand[1] * 1.5 - 160 + s.y * 0.7, p * (1 + 0.15 * Math.sin(v * 8 + i)), v * 40);
    });
    return;
  }
  // shot C: the link line
  if (t < T.link + 0.2) whipIn(D.s, D.blur, t, T.link - 0.25, 1);
  D.cam(...key(t, [[T.link - 0.25, [540, 1010, 1.2]], [A2, [540, 1000, 1.28], (p) => p]]));
  show(card, false);
  sparks.forEach((s) => show(s.g, false));
  const offer = eio(prog(t, T.link, 0.3));
  D.kid.pose({
    x: 540, y: 1640, s: 1.5, tilt: 2 * Math.sin(t * 2.4),
    face: t < T.comment - 0.1 ? 'talk' : 'grin', pop: pop(t, [T.link, T.comment - 0.1]),
    handL: [lerp(-70, -215, offer), lerp(-200, -360, offer) - 8 * offer * Math.sin(t * 6)], handR: [70, -200],
  });
});

// ================= shot B: the tool (PLACEHOLDER: a reel shows the real page here) =================
const sB = S('g', {}, svg);
const wB = S('g', {}, sB);
const camB = camera(wB);
const blurB = L.blurOf('mbTool');
S('rect', { x: -400, y: -400, width: 1880, height: 2720, fill: '#DCE6FF' }, wB);
S('rect', { x: 190, y: 200, width: 700, height: 1250, rx: 84, fill: NAVY, ...line }, wB);
S('rect', { x: 222, y: 240, width: 636, height: 1170, rx: 60, fill: '#fff' }, wB);
S('rect', { x: 260, y: 290, width: 240, height: 26, rx: 13, fill: '#C9CEDA' }, wB);
// the photo of the messy notes, then the typed notes
const photo = S('g', {}, wB);
S('rect', { x: 262, y: 360, width: 556, height: 670, rx: 26, fill: '#FFF6E0', ...line, 'stroke-width': 4 }, photo);
for (let k = 0; k < 9; k++) S('rect', { x: 262, y: 440 + k * 66, width: 556, height: 3, fill: '#B9CBF2' }, photo);
const messy = [];
const typed = [];
for (let k = 0; k < 8; k++) {
  const y = 430 + k * 66;
  const w = [460, 400, 440, 300, 420, 380, 440, 260][k];
  let d = `M300,${y}`;
  for (let x = 300; x < 300 + w; x += 30) d += ` q15,${k % 2 ? -18 : 16} 30,${(k * 7) % 5 - 2}`;
  messy.push(S('path', { d, fill: 'none', stroke: '#3B4A8C', 'stroke-width': 7, 'stroke-linecap': 'round' }, photo));
  typed.push(S('rect', { x: 300, y: y - 12, width: w * 0.95, height: 22, rx: 11, fill: k === 0 ? BLUE : NAVY, opacity: 0.85 }, photo));
}
const scan = S('rect', { x: 262, y: 0, width: 556, height: 10, rx: 5, fill: GREEN }, wB);
const doneTick = S('g', {}, wB);
S('circle', { r: 64, fill: GREEN, ...line }, doneTick);
S('path', { d: 'M-28,2 L-8,22 L30,-20', fill: 'none', stroke: '#fff', 'stroke-width': 14, 'stroke-linecap': 'round', 'stroke-linejoin': 'round' }, doneTick);
const btn = S('g', {}, wB);
S('rect', { x: -190, y: -60, width: 380, height: 120, rx: 60, fill: BLUE, ...line }, btn);
S('text', { y: 20, 'text-anchor': 'middle', 'font-size': 56, fill: '#fff' }, btn, 'Convert');
const flash = S('rect', { x: -400, y: -400, width: 1880, height: 2720, fill: '#fff' }, sB);

U.push((t) => {
  const on = t >= T.how - 0.25 && t < T.link + 0.2;
  show(sB, on);
  if (!on) return;
  if (t < T.how + 0.3) whipIn(sB, blurB, t, T.how - 0.25, 1); else whip(sB, blurB, 0, 0);
  camB(...key(t, [[T.how - 0.25, [540, 860, 1.0]], [T.tool, [540, 880, 1.05]], [T.press, [540, 900, 1.1]], [T.link, [540, 890, 1.08]]]));
  const shot = Q[1].a + 0.25;
  flash.setAttribute('opacity', 0.9 * Math.exp(-(((t - shot) / 0.08) ** 2)) * (t > shot - 0.2 ? 1 : 0));
  const inP = backOut(prog(t, shot, 0.35));
  show(photo, t > shot - 0.02);
  photo.setAttribute('transform', `translate(540 695) scale(${lerp(0.8, 1, inP)}) rotate(${lerp(-6, 0, inP)}) translate(-540 -695)`);
  place(btn, 540, 1160, backOut(prog(t, T.tool + 0.1, 0.35)) * (1 - 0.1 * pulse(t, T.press + 0.12, 0.07)));
  const sw = prog(t, T.press + 0.15, 0.6);
  show(scan, sw > 0 && sw < 1);
  scan.setAttribute('y', lerp(360, 1020, sw));
  messy.forEach((m, k) => { const p = prog(t, T.press + 0.15 + (k / 8) * 0.6, 0.12); m.setAttribute('opacity', 1 - p); typed[k].setAttribute('opacity', 0.85 * p); });
  const dt = backOut(prog(t, T.press + 0.8, 0.35));
  show(doneTick, dt > 0);
  place(doneTick, 780, 380, dt);
});

// ================= captions, the link line, the pointer =================
const clean = (ws) => ws.map((x) => ({ ...x, word: x.word.replace(/[।,]+$/, '') }));
U.push(captionsCompact(stage, Q.map((s, i) => ({ words: clean(s.words), a: i ? s.a : 0, b: i < Q.length - 1 ? Q[i + 1].a - 0.03 : dur + 1, whole: i === 0 }))));
const link = linkLine(stage, 'tool link');
const tip = pointer(stage, NAVY, '#fff', 130);
const TIP = [
  [T.tool, [1160, 1500]], [T.press - 0.05, [560, 1250], cubicOut], [T.link - 0.25, [560, 1250]],
  [T.comment + 0.2, [1170, 1460]], [T.post - 0.08, [935, 1250], cubicOut], [dur, [935, 1250]],
];
const SHOWN = [[T.tool, T.link - 0.25], [T.comment + 0.2, A2 - 0.05]];
U.push((t) => {
  link.set(t, { link: T.link, comment: T.comment, post: T.post, away: A2 + 0.1 });
  tip.style.visibility = SHOWN.some(([a, b]) => t >= a && t < b) ? 'visible' : 'hidden';
  const [x, y] = key(t, TIP);
  const click = pulse(t, T.press + 0.1, 0.07) + pulse(t, T.post + 0.02, 0.07);
  tip.style.transform = `translate(${x + 5 * Math.sin(t * 3)}px,${y + 4 * Math.sin(t * 2.2)}px) scale(${1 - 0.14 * click})`;
});

start(stage, U, dur);
</script>
</body>
</html>
