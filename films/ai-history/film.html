<!doctype html>
<html lang="hi">
<head>
<meta charset="utf-8">
<title>#04 AI का इतिहास: 1956 से 2026</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@700;800&family=Mukta:wght@500;600;700&display=block" rel="stylesheet">
<style>
  html, body { margin: 0; background: #111; overflow: hidden; }
  #stage { width: 1080px; height: 1920px; position: relative; overflow: hidden; transform-origin: 0 0; background: var(--paper); }
  #paper { position: absolute; inset: -200px 0; background-image: repeating-linear-gradient(#0000 0 94px, var(--rule) 94px 97px); }
  svg { position: absolute; left: 0; top: 0; overflow: visible; }
</style>
</head>
<body>
<div id="stage">
  <div id="paper"></div>
  <svg id="world" width="1080" height="1920"></svg>
  <div id="caps"></div>
</div>
<script type="module">
// Hero weird image: 70 years of AI as one line that rises, falls twice and rises again.
// The mascot walks the whole line; the camera shows all of it, then follows, then shows all of it.
import { $, boot, bump, clamp, createKit, ei, eio, eo, header, lerp, mulberry32, preview, prog, sp } from '/brand/kagaz.js';
import { build } from './timeline.js';

const stage = document.getElementById('stage');
const brand = await boot(stage);
const vo = await (await fetch('vo.json')).json();
const meta = await (await fetch('script.json')).json();
const { dur, L, T } = build(vo);
const kit = createKit(brand);
const { stroke, pop, txt, card, sunburst, sticker, mascot, U, PAPER, CARD, INK, RED, BLUE, PINK, YELLOW, MINT, ORANGE } = kit;
header(stage, brand, 'AI', meta.number, meta.title);

const text = (parent, x, y, str, a = {}) => {
  const e = $('text', { x, y, 'font-family': '"Baloo 2"', 'font-weight': 800, 'font-size': 80, fill: INK, 'text-anchor': 'middle', ...a }, parent);
  e.textContent = str;
  return e;
};
const MUK = { 'font-family': 'Mukta', 'font-weight': 700 };
const root = $('g', {}, document.getElementById('world'));
sunburst(root, 540, 1000);

function stamp(parent, x, y, rot, str, t, o = {}) {
  const { color = PINK, w = 330, size = 70, out = null } = o;
  const g = $('g', {}, parent);
  $('rect', { x: -w / 2 + 10, y: -46, width: w, height: 112, rx: 14, fill: INK }, g);
  $('rect', { x: -w / 2, y: -56, width: w, height: 112, rx: 14, fill: color, stroke: INK, 'stroke-width': 9 }, g);
  text(g, 0, 28, str, { 'font-size': size, fill: color === YELLOW || color === MINT ? INK : PAPER });
  U.push((time) => {
    const q = time - t;
    let k = q < 0 ? 0 : lerp(2.6, 1, eo(clamp(q / 0.12))) * (1 + 0.06 * bump(q - 0.12));
    if (out != null) k *= 1 - ei(prog(time, out, 0.15));
    g.style.display = k <= 0.002 ? 'none' : '';
    g.setAttribute('transform', `translate(${x} ${y}) rotate(${rot}) scale(${k})`);
  });
  return g;
}
const cross = (g, x, y, r, t, o = {}) => {
  stroke(g, [[x - r, y - r], [x + r, y + r]], { t, d: 0.12, w: o.w ?? 34, color: RED, amp: 5, out: o.out ?? null });
  stroke(g, [[x + r, y - r], [x - r, y + r]], { t: t + 0.1, d: 0.12, w: o.w ?? 34, color: RED, amp: 5, out: o.out ?? null });
};
const yearCard = (parent, x, y, str, t, rot = -4) => {
  const c = card(parent, x, y, 330, 150, rot, t, { fill: YELLOW });
  text(c, 0, 40, str, { 'font-size': 116 });
  return c;
};

// ---------- the line: 70 years ----------
const PTS = [[200, 1300], [700, 900], [1150, 1350], [1550, 1050], [1950, 1400], [2450, 1000], [2950, 750], [3350, 480], [3700, 150], [3900, 60]];
const yAt = (x) => {
  for (let i = 1; i < PTS.length; i++) if (x <= PTS[i][0]) return lerp(PTS[i - 1][1], PTS[i][1], (x - PTS[i - 1][0]) / (PTS[i][0] - PTS[i - 1][0]));
  return PTS[PTS.length - 1][1];
};
const OV = { s: 0.24, x: 2050, y: 420 }; // the whole line on screen
const CAM = [
  { t: -9, ...OV },
  { t: T.toStart + 0.45, s: 1, x: 500, y: 1040 },
  { t: T.promise + 0.4, s: 1, x: 780, y: 880 },
  { t: T.toWin + 0.45, s: 1, x: 1150, y: 1180 },
  { t: T.toWin2 + 0.4, s: 1, x: 1950, y: 1230 },
  { t: T.toChess + 0.45, s: 1, x: 2500, y: 980 },
  { t: T.toDeep + 0.45, s: 1, x: 3000, y: 760 },
  { t: T.toGpt + 0.45, s: 1, x: 3600, y: 300 },
  { t: T.toPay + 0.5, ...OV },
];
function cam(t) {
  let c = CAM[0];
  for (let i = 1; i < CAM.length; i++) {
    const p = eio(prog(t, CAM[i].t - 0.5, 0.5));
    if (p <= 0) break;
    c = { s: Math.exp(lerp(Math.log(c.s), Math.log(CAM[i].s), p)), x: lerp(c.x, CAM[i].x, p), y: lerp(c.y, CAM[i].y, p) };
  }
  return c;
}
// where the mascot stands on the line
const WALK = [[-9, 250], [T.toStart + 0.5, 330], [T.promise + 0.5, 700], [T.toWin + 0.55, 1150], [T.toWin2 + 0.45, 1950], [T.toChess + 0.55, 2450], [T.toDeep + 0.55, 2950], [T.toGpt + 0.55, 3700], [T.toPay + 0.6, 3900]];
const walk = (t) => WALK.reduce((x, [kt, kx], i) => (i === 0 ? kx : lerp(x, kx, eio(prog(t, kt - 0.6, 0.6)))), 0);

const world = $('g', {}, root);
U.push((t) => {
  const c = cam(t);
  world.setAttribute('transform', `translate(${540 - c.x * c.s} ${1000 - c.y * c.s}) scale(${c.s})`);
});
stroke(world, PTS, { t: -0.5, d: 0.7, w: 46, color: INK, smooth: true, amp: 3 });
stroke(world, PTS, { t: -0.45, d: 0.7, w: 26, color: PINK, smooth: true, amp: 3 });
[[200, MINT], [2450, YELLOW], [2950, YELLOW], [3700, YELLOW], [3900, MINT]].forEach(([x, col]) => {
  const d = $('g', { transform: `translate(${x} ${yAt(x)})` }, world);
  $('circle', { r: 52, fill: col, stroke: INK, 'stroke-width': 14 }, d);
});

// ---------- 1956: the name and the promise ----------
yearCard(world, 300, 720, '1956', T.toStart + 0.3);
{
  const n = card(world, 760, 1230, 560, 230, 3, T.name);
  text(n, 0, -12, 'Artificial', { 'font-size': 84 });
  text(n, 0, 78, 'Intelligence', { 'font-size': 84 });
  const b = pop(world, 1040, 620, { t: T.think, rot: 4, out: T.toWin });
  $('circle', { cx: -190, cy: 150, r: 18, fill: CARD, stroke: INK, 'stroke-width': 8 }, b);
  $('circle', { cx: -150, cy: 112, r: 28, fill: CARD, stroke: INK, 'stroke-width': 8 }, b);
  $('rect', { x: -208, y: -78, width: 440, height: 180, rx: 80, fill: INK }, b);
  $('rect', { x: -220, y: -92, width: 440, height: 180, rx: 80, fill: CARD, stroke: INK, 'stroke-width': 10 }, b);
  text(b, 0, -10, 'machine', { 'font-size': 66 });
  text(b, 0, 58, 'सोचेगी!', { 'font-size': 66, fill: PINK });
}

// ---------- the two AI winters ----------
function snow(cx, cy, t, seed) {
  const r = mulberry32(seed);
  for (let i = 0; i < 9; i++) {
    const x = cx + (r() - 0.5) * 900;
    const y0 = cy - 500 + r() * 300;
    const s = 26 + r() * 22;
    const g = $('g', {}, world);
    for (let k = 0; k < 3; k++) $('path', { d: `M${-s} 0 H${s}`, stroke: BLUE, 'stroke-width': 11, 'stroke-linecap': 'round', transform: `rotate(${k * 60})` }, g);
    const ph = r() * 6;
    U.push((time) => {
      const k = sp(time - t - i * 0.05);
      g.style.display = k <= 0.002 ? 'none' : '';
      g.setAttribute('transform', `translate(${x + Math.sin(time * 2 + ph) * 26} ${y0 + ((time - t) * 140 + ph * 60) % 620}) rotate(${time * 60 + ph * 50}) scale(${k})`);
    });
  }
}
{
  const m = card(world, 800, 1010, 250, 250, -6, T.toWin + 0.35);
  text(m, 0, 52, '₹', { 'font-size': 190, 'font-family': 'Mukta' });
  cross(m, 0, 0, 90, T.money);
  stamp(world, 1180, 820, -4, 'AI winter', T.winter, { color: BLUE, w: 520, size: 96 });
  snow(1150, 1250, T.winter - 0.3, 3);
  stamp(world, 1950, 880, 4, 'winter #2', T.twice, { color: BLUE, w: 520, size: 92 });
  snow(1950, 1300, T.toWin2 + 0.2, 8);
  const st = sticker(world, 'star', 2290, 1130, 120, ORANGE, { t: T.twice + 0.15, rot: 8 });
  text(st, 0, 36, '2 बार', { 'font-size': 76 });
}

// ---------- 1997: a computer beats the chess champion ----------
yearCard(world, 2160, 720, '1997', T.toChess + 0.3);
{
  const c = card(world, 2790, 1190, 420, 360, 4, T.chess);
  for (let i = 0; i < 4; i++) for (let k = 0; k < 4; k++) if ((i + k) % 2) $('rect', { x: -150 + i * 56, y: -150 + k * 56, width: 56, height: 56, fill: INK }, c);
  $('rect', { x: -150, y: -150, width: 224, height: 224, fill: 'none', stroke: INK, 'stroke-width': 8 }, c);
  text(c, 0, 142, 'chess', { 'font-size': 70 });
  stroke(c, [[100, -70], [130, -36], [182, -116]], { t: T.beat, d: 0.16, w: 24, color: RED, amp: 2 });
}

// ---------- 2012: deep learning wins at recognising photos ----------
yearCard(world, 2650, 470, '2012', T.toDeep + 0.3);
{
  [[-110, -8], [0, 0], [110, 8]].forEach(([dx, rot], i) => {
    const c = card(world, 3230 + dx, 1000, 190, 220, rot, T.deep + i * 0.1, { rx: 18, sw: 8, shadow: [10, 12] });
    $('path', { d: 'M-50 -18 L-42 -76 L-6 -46Z M50 -18 L42 -76 L6 -46Z', fill: [INK, PINK, BLUE][i], stroke: INK, 'stroke-width': 7, 'stroke-linejoin': 'round' }, c);
    $('circle', { r: 54, fill: [CARD, YELLOW, MINT][i], stroke: INK, 'stroke-width': 7 }, c);
    $('circle', { cx: -20, cy: -6, r: 8, fill: INK }, c);
    $('circle', { cx: 20, cy: -6, r: 8, fill: INK }, c);
    $('path', { d: 'M-12 22 q6 9 12 0 q6 9 12 0', fill: 'none', stroke: INK, 'stroke-width': 5, 'stroke-linecap': 'round' }, c);
  });
  stamp(world, 3230, 1190, -3, 'deep learning', T.deep + 0.25, { color: PINK, w: 540, size: 78 });
  const tr = sticker(world, 'star', 3440, 830, 90, YELLOW, { t: T.won, rot: -8 });
  text(tr, 0, 34, '#1', { 'font-size': 88 });
}

// ---------- 2022: ChatGPT ----------
yearCard(world, 3280, -40, '2022', T.toGpt + 0.3);
{
  const c = card(world, 3420, 640, 520, 300, -3, T.gpt);
  text(c, 0, -22, 'ChatGPT', { 'font-size': 104 });
  $('rect', { x: -150, y: 24, width: 300, height: 96, rx: 48, fill: INK }, c);
  [-66, 0, 66].forEach((x, i) => {
    const d = $('circle', { cx: x, r: 16, fill: PAPER }, c);
    U.push((t) => d.setAttribute('cy', 72 - Math.max(0, Math.sin(t * 12 - i * 1.1)) * 18));
  });
}

// ---------- the mascot walks the line ----------
const mg = $('g', {}, world);
mascot(mg, 0, 0, 0.3, {
  t: -0.3,
  pose: (t) => {
    const cold = (t > T.winter - 0.2 && t < T.toChess) ? 1 : 0;
    return { look: [600, -500], mouth: cold ? 0.05 : t > T.gpt ? 1 : 0.6, wave: t > T.gpt ? 1 : 0, squash: cold ? 0.03 * Math.sin(t * 40) : 0 };
  },
});
U.push((t) => {
  const x = walk(t);
  const moving = Math.abs(walk(t + 0.03) - x) > 0.5;
  const c = cam(t);
  // in the overview the mascot is drawn larger so it can be seen
  const k = lerp(1, 2.2, clamp((1 - c.s) / 0.76));
  mg.setAttribute('transform', `translate(${x} ${yAt(x) - 20 - (moving ? Math.abs(Math.sin(t * 16)) * 40 : 0)}) scale(${k})`);
});

// ---------- hook and payoff, on top of the overview ----------
{
  const O = $('g', {}, root);
  const seen = (t) => (t < T.toStart + 0.2 ? 1 - ei(prog(t, T.toStart - 0.1, 0.3)) : eo(prog(t, T.toPay + 0.3, 0.3)));
  const st = sticker(O, 'star', 290, 800, 185, ORANGE, { rot: -8 });
  text(st, 0, 20, '70', { 'font-size': 190 });
  text(st, 0, 90, 'साल', { 'font-size': 72 });
  const y0 = card(O, 170, 1500, 250, 120, -5, -0.3, { fill: YELLOW, rx: 20 });
  text(y0, 0, 32, '1956', { 'font-size': 88 });
  const y1 = card(O, 890, 780, 250, 120, 5, -0.2, { fill: YELLOW, rx: 20 });
  text(y1, 0, 32, '2026', { 'font-size': 88 });
  U.push((t) => { O.style.display = seen(t) <= 0.002 ? 'none' : ''; O.setAttribute('opacity', 1); O.setAttribute('transform', `translate(540 1000) scale(${seen(t)}) translate(-540 -1000)`); });
  // the two falls, marked on the overview line
  const F = $('g', {}, root);
  const pt = (x) => [540 + (x - OV.x) * OV.s, 1000 + (yAt(x) - OV.y) * OV.s];
  [1150, 1950].forEach((x, i) => {
    const [px, py] = pt(x);
    cross(F, px, py, 46, T.fail + i * 0.25, { w: 26, out: T.toStart - 0.1 });
    const c = pop(F, px, py + 120, { t: T.fail + i * 0.25 + 0.1, out: T.toStart - 0.1, rot: i ? 4 : -4 });
    $('rect', { x: -92, y: -44, width: 200, height: 96, rx: 14, fill: INK }, c);
    $('rect', { x: -100, y: -52, width: 200, height: 96, rx: 14, fill: CARD, stroke: INK, 'stroke-width': 8 }, c);
    text(c, 0, 20, 'fail', { 'font-size': 66, fill: RED });
  });
  stamp(root, 590, 1370, -3, '70 साल की मेहनत', T.years, { color: BLUE, w: 820, size: 96 });
}

// ---------- captions ----------
const hl = {
  hook: ['सत्तर साल', 'दो बार'], name: ['Artificial', 'machine'], winter: ['पैसा', 'AI winter'], twice: ['दो बार'],
  chess: ['chess champion'], deep: ['deep learning'], gpt: ['ChatGPT'], pay: ['एक रात', 'सत्तर साल'],
};
const caps = [];
for (const id of Object.keys(hl)) L[id].s.forEach((s, i) => caps.push({ ...s, hl: hl[id][i] }));
// the hook is fully readable on frame 0
caps[0].words = caps[0].text.split(' ').map((word) => ({ word, t: -1 }));
kit.captions(document.getElementById('caps'), caps, dur);

// ---------- seek ----------
const paperEl = document.getElementById('paper');
window.DUR = dur;
window.seek = (t) => {
  const c = cam(t);
  paperEl.style.transform = `translateY(${-(c.x * 0.08) % 97}px)`;
  kit.frame(t);
};
window.seek(0);
window.ready = true;
if (!new URLSearchParams(location.search).has('render')) preview(stage, window.seek);
</script>
</body>
</html>
